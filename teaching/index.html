<!doctype html>
<html lang="en">
<head><meta name="color-scheme" content="light dark">
<script src="/site-assets/theme.js"></script>
<link rel="stylesheet" href="/site-assets/theme.css">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A bilingual teaching case on literary genre: read closely, inspect models, and test an interpretation.">
  <title>Tragedy or History? Reading Genre with Models</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="visuals.css">
</head>
<body>
  <a class="skip-link" href="#slide">Skip to the teaching slide</a>
  <header class="site-header">
    <a class="brand" href="https://stylometry.digihumeng.org/" target="_top">Stylometry <span id="brand-context">Teaching case</span></a>
    <a id="native-case-link" href="https://interpretable-deep-learning-stylometry.ngrok.app/play/genre-case-study/" target="_top">Open in Playground</a>
    <div class="languages" role="group" aria-label="Language"><button data-lang="en" lang="en">English</button><button data-lang="ko" lang="en">Korean</button></div>
  </header>
  <div class="course-heading"><h1 id="course-title"></h1><p id="course-subtitle"></p></div>
  <div class="teaching-toolbar" aria-label="Teaching controls">
    <button id="outline-toggle" aria-controls="course-outline" aria-expanded="false">Contents</button>
    <div class="slide-selector"><label for="slide-select" id="select-label"></label><select id="slide-select"></select></div>
    <button id="notes-toggle" aria-haspopup="dialog"></button>
    <button id="presentation-toggle" class="presentation-toggle" aria-pressed="false"></button>
  </div>
  <div class="course-shell">
    <aside class="course-outline" id="course-outline" hidden>
      <div class="outline-top"><h2 id="outline-label"></h2><button id="outline-close" aria-label="Close contents">×</button></div>
      <nav id="section-list" aria-label="Case-study contents"></nav>
      <p id="outline-note"></p>
    </aside>
    <main class="course-main">
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
      <p id="announcer" class="sr-only" aria-live="polite"></p>
      <article id="slide" tabindex="-1"></article>
      <footer class="course-footer"><span id="keyboard-help"></span><button id="sources-toggle" class="text-button" aria-haspopup="dialog"></button></footer>
    </main>
  </div>
  <nav class="slide-navigation" aria-label="Slide navigation">
    <button id="previous"></button>
    <div class="navigation-progress"><span id="slide-count"></span><small id="section-count"></small></div>
    <button id="next" class="primary"></button>
  </nav>
  <dialog id="notes-panel" class="text-dialog" aria-labelledby="notes-title">
    <div class="dialog-top"><h2 id="notes-title"></h2><button id="close-notes"></button></div>
    <label for="notes" id="notes-label"></label><textarea id="notes" rows="10"></textarea>
    <div class="notes-actions"><span id="notes-help"></span><button id="download-notes"></button></div>
  </dialog>
  <dialog id="sources-dialog" class="text-dialog" aria-labelledby="sources-title">
    <div class="dialog-top"><h2 id="sources-title"></h2><button id="close-sources"></button></div><div id="sources"></div>
  </dialog>
  <dialog id="figure-dialog" aria-labelledby="dialog-title">
    <div class="dialog-top"><h2 id="dialog-title"></h2><button id="close-figure" autofocus></button></div>
    <div class="figure-scroll"><img id="dialog-image" alt=""></div><p id="dialog-caption"></p>
  </dialog>
  <dialog id="practice-dialog" aria-labelledby="practice-dialog-title">
    <div class="dialog-top"><div><p class="dialog-kicker" id="practice-dialog-kicker"></p><h2 id="practice-dialog-title"></h2></div><button id="close-practice"></button></div>
    <div class="practice-dialog-tools"><p id="practice-language-note"></p><a id="practice-full-link" target="_blank" rel="noopener"></a></div>
    <p id="practice-loading" role="status"></p><div id="practice-frame-host"></div>
  </dialog>
  <script src="content.js"></script><script src="practice.js"></script><script src="passages.js"></script><script src="case-data.js"></script><script src="case-study.js"></script><script src="case-visuals.js"></script><script src="readings.js"></script><script src="practice-links.js"></script><script src="visual-evidence.js"></script><script src="visuals.js"></script><script src="course.js"></script>
</body>
</html>
